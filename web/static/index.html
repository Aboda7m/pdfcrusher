<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="author" content="Abdulrahman Alnotefi">
<title>ضغط ملفات PDF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b49c7'/%3E%3Cpath d='M16 7v13M10.5 14.5 16 20l5.5-5.5M9 25h14' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="page">
  <header class="intro">
    <h1>ضغط ملفات PDF</h1>
    <p>اختر ملف PDF وسنحاول ضغطه تلقائياً إلى أقل من 499KB.</p>
  </header>

  <section class="card" aria-label="أداة ضغط PDF">
    <noscript>
      <div class="box err">يتطلب هذا التطبيق تفعيل JavaScript في المتصفح.</div>
    </noscript>

    <label class="drop" id="drop">
      <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <span class="drop-title">اختر ملف PDF أو اسحبه هنا</span>
      <span class="drop-hint" id="drop-hint">يبدأ الضغط تلقائياً بعد الاختيار</span>
      <span class="drop-cta" aria-hidden="true">اختيار ملف</span>
      <span class="drop-limits">ملفات PDF فقط · حتى 60 ميغابايت</span>
      <input type="file" id="file" accept="application/pdf,.pdf" aria-describedby="drop-hint">
    </label>

    <div class="state" id="work" tabindex="-1" hidden>
      <div class="file-row">
        <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        <div class="file-meta">
          <div class="name" id="fname"></div>
          <div class="file-size" id="fsize"></div>
        </div>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="status"><i id="fill"></i></div>
      <p class="msg" id="status" role="status"></p>
    </div>

    <div class="state result" id="result" hidden>
      <div class="result-head">
        <svg class="result-icon ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>
        <svg class="result-icon attn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>
        <h2 class="result-title">الملف جاهز للتحميل</h2>
      </div>
      <div class="name" id="rname"></div>
      <div class="box warn" id="warn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.5v.01"/></svg>
        <span id="warntext"></span>
      </div>
      <dl class="stats">
        <div class="stat"><dt>الحجم قبل</dt><dd id="sBefore"></dd></div>
        <div class="stat after"><dt>الحجم بعد</dt><dd id="sAfter"></dd></div>
        <div class="stat"><dt>نسبة التوفير</dt><dd id="sSaved"></dd></div>
      </dl>
      <div class="actions">
        <a class="btn" id="dl" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
          تحميل الملف
        </a>
        <button class="btn ghost" type="button" id="again1">ضغط ملف آخر</button>
      </div>
    </div>

    <div class="state" id="fail" hidden>
      <div class="box err" id="errbox" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
        <span id="errmsg"></span>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="retry">حاول مجدداً</button>
        <button class="btn ghost" type="button" id="again2">اختيار ملف آخر</button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p dir="ltr" lang="en">Developed by Abdulrahman Alnotefi · <a href="https://github.com/Aboda7m/pdfcrusher" target="_blank" rel="noopener noreferrer" aria-label="Aboda7m, PDF Crusher on GitHub (opens in a new tab)">Aboda7m</a></p>
</footer>

<script>
(() => {
  const MAX = 60 * 1024 * 1024;
  const $ = id => document.getElementById(id);
  const input = $('file'), drop = $('drop');
  let current = null, pollTimer = null, xhr = null;

  const show = which => {
    for (const id of ['drop','work','result','fail']) $(id).hidden = id !== which;
  };
  const focusEl = el => { try { el.focus({ preventScroll: true }); } catch (_) {} };
  const fmt = n => n == null ? '' :
    n >= 1048576 ? (n/1048576).toFixed(2) + ' م.ب' : Math.max(1, Math.round(n/1024)) + ' ك.ب';

  function fail(text){
    clearTimeout(pollTimer);
    $('errmsg').textContent = text;
    show('fail');
    focusEl($('retry'));
  }
  function reset(){
    clearTimeout(pollTimer); if (xhr) xhr.abort();
    current = null; input.value = ''; show('drop');
    focusEl(input);
  }
  function setStatus(text, pct){
    $('status').textContent = text;
    const bar = $('bar');
    if (pct == null){ bar.classList.add('busy'); $('fill').style.width = ''; bar.removeAttribute('aria-valuenow'); }
    else { bar.classList.remove('busy'); $('fill').style.width = pct + '%'; bar.setAttribute('aria-valuenow', pct); }
  }

  function start(file){
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf'){
      current = null; return fail('الرجاء اختيار ملف بصيغة PDF.');
    }
    if (file.size > MAX){ current = null; return fail('حجم الملف أكبر من الحد المسموح (60 ميغابايت).'); }
    current = file;
    $('fname').textContent = file.name;
    $('fsize').textContent = fmt(file.size);
    show('work'); setStatus('جاري رفع الملف… 0%', 0);
    focusEl($('work'));

    const fd = new FormData(); fd.append('file', file);
    xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/jobs');
    xhr.upload.onprogress = e => {
      if (e.lengthComputable){
        const p = Math.round(e.loaded / e.total * 100);
        setStatus('جاري رفع الملف… ' + p + '%', p);
      }
    };
    xhr.upload.onload = () => setStatus('جاري تجهيز الملف…', null);
    xhr.onerror = () => fail('تعذر الاتصال بالخدمة. تحقق من الاتصال ثم حاول مجدداً.');
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch(_){}
      if (xhr.status === 202 && data.id){ poll(data.id, file); }
      else fail(data.error || 'تعذر رفع الملف. حاول مجدداً.');
    };
    xhr.send(fd);
  }

  function poll(id, file){
    const tick = async () => {
      try {
        const r = await fetch('/api/jobs/' + encodeURIComponent(id), {cache:'no-store'});
        const s = await r.json();
        if (s.status === 'queued') setStatus('الملف في قائمة الانتظار…', null);
        else if (s.status === 'compressing') setStatus('جاري الضغط… قد يستغرق ذلك دقيقة أو أكثر', null);
        else if (s.status === 'finalizing') setStatus('جاري تجهيز الملف…', null);
        else if (s.status === 'done' || s.status === 'done_warning'){
          $('rname').textContent = file.name;
          $('dl').href = '/api/jobs/' + encodeURIComponent(id) + '/download';
          $('sBefore').textContent = fmt(s.orig_size);
          $('sAfter').textContent = fmt(s.out_size);
          const saved = (s.orig_size > 0 && s.out_size != null)
            ? Math.round((1 - s.out_size / s.orig_size) * 100) : null;
          $('sSaved').textContent = (saved != null && saved > 0) ? saved + '%' : '—';
          const w = $('warn');
          if (s.status === 'done_warning'){ $('warntext').textContent = s.message; w.hidden = false; } else w.hidden = true;
          $('result').classList.toggle('is-warn', s.status === 'done_warning');
          show('result'); focusEl($('dl')); return;
        }
        else if (s.status === 'error'){ return fail(s.message || 'حدث خطأ أثناء المعالجة.'); }
      } catch(_){ /* انقطاع مؤقت: نكمل المحاولة */ }
      pollTimer = setTimeout(tick, 1500);
    };
    tick();
  }

  input.addEventListener('change', () => start(input.files[0]));
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => start(e.dataTransfer.files[0]));
  $('retry').addEventListener('click', () => current ? start(current) : reset());
  $('again1').addEventListener('click', reset);
  $('again2').addEventListener('click', reset);
})();
</script>
</body>
</html>
